services:
  postgres:
    image: public.ecr.aws/docker/library/postgres@sha256:e73790e2702b489f664605acbec5f5da6981bc7e432f0489e52a53c9d1e7467f
  skyvern:
    image: public.ecr.aws/skyvern/skyvern@sha256:768e0578f678057cca1ea5d563cb2e42b44f613f0d93a40ae27cbc474a1214a9
    env_file: !override
      - .env
      - .env.bailian
    ports: !override
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:6080:6080"
  skyvern-ui:
    image: public.ecr.aws/skyvern/skyvern-ui@sha256:46cb557a83017ee6438a39c0ffc001790624908869b1b0b93045a8fef7d35033
    volumes:
      - ./skyvern-frontend/dist:/app/dist.template:ro
    ports: !override
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
  form-demo:
    image: public.ecr.aws/skyvern/skyvern@sha256:768e0578f678057cca1ea5d563cb2e42b44f613f0d93a40ae27cbc474a1214a9
    entrypoint: ["python", "/demo/server.py"]
    restart: unless-stopped
    volumes:
      - ./local-demo:/demo:ro
      - ./artifacts/local-demo:/data
    ports:
      - "127.0.0.1:8765:8765"
  flowtrail:
    image: public.ecr.aws/skyvern/skyvern@sha256:768e0578f678057cca1ea5d563cb2e42b44f613f0d93a40ae27cbc474a1214a9
    entrypoint: ["python", "-m", "uvicorn", "flowtrail_service.api:create_app", "--factory", "--app-dir", "/workspace", "--host", "0.0.0.0", "--port", "8001", "--workers", "1"]
    restart: unless-stopped
    environment:
      SKYVERN_URL: http://skyvern:8000
      FLOWTRAIL_DB: /data/operations.sqlite3
      FLOWTRAIL_ALLOW_FIXTURE: "true"
      FLOWTRAIL_ORIGINS: "${FLOWTRAIL_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}"
    volumes:
      - ./flowtrail_service:/workspace/flowtrail_service:ro
      - ./.flowtrail:/data
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      skyvern:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
