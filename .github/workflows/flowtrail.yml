name: FlowTrail checks
on:
  push:
    branches: [main, codex/flowtrail]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flowtrail-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Scenario tests, evidence and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: skyvern-frontend/package-lock.json
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"
      - run: npm ci
        working-directory: skyvern-frontend
      - name: Scenario and regression tests (no model calls)
        working-directory: skyvern-frontend
        run: npm test -- src/routes/wenjuanxing src/api/AxiosClient.test.ts src/routes/root src/components/SidebarTreeNav.test.tsx src/hooks/localDiagnostics.test.ts
      - name: Scenario lint
        working-directory: skyvern-frontend
        run: npx --no-install eslint src/routes/wenjuanxing/WenjuanxingPage.tsx src/routes/wenjuanxing/WenjuanxingPage.test.tsx src/routes/wenjuanxing/ExecutionReport.tsx src/routes/wenjuanxing/ExecutionReport.test.tsx --max-warnings 0
      - name: Evidence evaluator regression tests
        working-directory: skyvern-frontend
        run: node --test scripts/tests/*.node.mjs
      - name: Coordinator test dependencies
        run: python -m pip install -r flowtrail_service/requirements-test.txt
      - name: Durable lifecycle and HTTP boundary tests
        run: python -m unittest discover -s flowtrail_service/tests -p 'test_*.py'
      - name: Local fixture regression tests
        run: python -m unittest discover -s local-demo -p 'test_*.py'
      - name: Documentation file links
        run: python scripts/check_flowtrail_docs.py
      - name: TypeScript and production build
        working-directory: skyvern-frontend
        run: npm run build
